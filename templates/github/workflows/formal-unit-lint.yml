# Template: formal unit/lint as CI (SPEC §15.3). An option, not the gate.
# Copy into the product repo as .github/workflows/formal-unit-lint.yml.
# The unit_lint gate is the verifier's own run at the PR head, recorded in its verdict's `gate`.
# A green run here is evidence the verifier may cite. A product that copies it sets
# `ci: github-actions` in its binding.
# It does not call an agent, and it does not read secrets, .env, or password vaults.
#
# Store tests (SPEC §15.7). The defaults are neutral: no database service, an
# empty STORE_TEST_PATTERN and EXPECT_STORE_TESTS "0", so the store step checks
# nothing. A product with store tests adds its own database service to the job,
# names those tests in STORE_TEST_PATTERN (a regular expression) and sets
# EXPECT_STORE_TESTS to "1". Then a skipped test whose line matches the pattern
# fails the job, and so does a run in which no matching test ran: store tests
# must not skip silently under CI. A service password is the image default for
# an ephemeral database, never a product credential.
name: formal-unit-lint
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  unit-lint:
    runs-on: ubuntu-latest
    env:
      STORE_TEST_PATTERN: ""
      EXPECT_STORE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          set -o pipefail
          if [ -x scripts/gate.sh ]; then
            bash scripts/gate.sh | tee unit.out
          elif [ -x scripts/unit.sh ]; then
            bash scripts/unit.sh | tee unit.out
          elif [ -d tests ]; then
            python3 -m unittest discover -s tests -t . -v | tee unit.out
          else
            echo "formal gate: no unit tests wired (scripts/gate.sh, scripts/unit.sh or tests/)" >&2
            exit 1
          fi
      - name: Store tests did not skip
        run: |
          python3 - <<'PY'
          import os, re, sys
          text = open("unit.out", encoding="utf-8", errors="replace").read()
          pattern = os.environ.get("STORE_TEST_PATTERN", "")
          expect = os.environ.get("EXPECT_STORE_TESTS") == "1"
          if not pattern:
              if expect:
                  print("formal gate: EXPECT_STORE_TESTS=1 but STORE_TEST_PATTERN is empty", file=sys.stderr)
                  sys.exit(1)
              sys.exit(0)
          skipped = [ln for ln in text.splitlines()
                     if re.search(r"\bskipped\b", ln, re.I) and re.search(pattern, ln, re.I)]
          if skipped:
              print("formal gate: store tests skipped under CI", file=sys.stderr)
              print("\n".join(skipped), file=sys.stderr)
              sys.exit(1)
          if expect and not re.search(pattern, text, re.I):
              print("formal gate: EXPECT_STORE_TESTS=1 but no test matched STORE_TEST_PATTERN", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Lint
        run: |
          if [ -x scripts/lint.sh ]; then
            bash scripts/lint.sh
          else
            echo "formal gate: scripts/lint.sh is missing" >&2
            exit 1
          fi
