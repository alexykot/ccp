<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Delivery board</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2937'/%3E%3Crect x='6' y='17' width='5' height='9' rx='1' fill='%2393c5fd'/%3E%3Crect x='13.5' y='11' width='5' height='15' rx='1' fill='%2393c5fd'/%3E%3Crect x='21' y='14' width='5' height='12' rx='1' fill='%2393c5fd'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --other: #b9b8b1;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --other: #5a5955;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --other: #5a5955;
}
* { box-sizing: border-box; }
/* Layout: a fluid dashboard. A header strip (blockers, tiles, Now) on every tab, then one tab of
   cards in an auto-filling grid: about 4 columns on a 16" laptop, 6 on a 21:9 screen, 1 on a phone. */
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
main { padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { main { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
@media (min-width: 1400px) { main { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
main > header { margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 620; text-wrap: balance; }
.meta { color: var(--ink-2); font-size: 13px; }
.grow { flex: 1; }
button.theme { background: none; border: 1px solid var(--axis); color: var(--ink-2); border-radius: 6px;
  padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.tile .k { color: var(--ink-2); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .d { color: var(--muted); font-size: 12px; }
/* Two halves inside a card: side by side when the card is wide enough, stacked when not. */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.cols > * { min-width: 0; }
.banner { border-radius: 8px; padding: 8px 12px; font-size: 13px; display: flex; gap: 8px;
  border: 1px solid var(--grid); background: var(--surface); }
.banner + .banner { margin-top: 8px; }
.banner b { white-space: nowrap; }
.banner.critical { border-color: var(--critical); }
.banner.critical b { color: var(--critical); } .banner.warning b { color: var(--serious); }
.banner.good b { color: var(--good); }
/* The header strip: blockers first, then the tiles and Now side by side where there is room. */
.strip { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.strip .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.strip .row > .tiles { flex: 1 1 960px; min-width: 0; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.strip .row > .now { flex: 1 1 480px; min-width: 0; }
.now dl { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; font-size: 13px; }
.now dl > div { min-width: 0; max-width: 100%; }
.now dt { color: var(--ink-2); font-size: 12px; }
.now dd { margin: 0; overflow-wrap: anywhere; }
.now h2 { margin-bottom: 6px; }
/* Tabs: hash-routed (#tab=<name>), keys 1 to 5, sticky above the cards. */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); display: flex; gap: 2px;
  overflow-x: auto; border-bottom: 1px solid var(--axis); margin-bottom: 14px; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); font: inherit; font-weight: 560;
  padding: 9px 12px 7px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); }
nav.tabs button:focus-visible, button:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
nav.tabs kbd { font: inherit; font-size: 11px; color: var(--muted); }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; line-height: 17px; text-align: center;
  background: var(--grid); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.badge.warn { background: var(--serious); color: #fff; }
nav.tabs .hint { margin-left: auto; align-self: center; color: var(--muted); font-size: 12px; padding: 0 4px; white-space: nowrap; }
@media (max-width: 700px) { nav.tabs kbd, nav.tabs .hint { display: none; } nav.tabs button { padding: 9px 9px 7px; } }
/* The grid of cards. A column is at least 400px (15vw on a wide screen); wide cards span 2, 3 or 4
   columns once that many exist, so a phone never gets an implicit extra column. The classes give
   each card its least span; fillRows() then widens the cards of a short row, in proportion, until
   the row is full, so no row ends in empty columns (cards keep their reading order). */
.pane[hidden] { display: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, max(400px, 15vw)), 1fr));
  align-items: start; grid-auto-flow: row; }
.grid > * { min-width: 0; }
.grid > .all { grid-column: 1 / -1; }
@media (min-width: 880px) { .grid > .s2, .grid > .s3, .grid > .s4 { grid-column: span 2; } }
@media (min-width: 1300px) { .grid > .s3, .grid > .s4 { grid-column: span 3; } }
@media (min-width: 1720px) { .grid > .s4 { grid-column: span 4; } }
@media (min-width: 2200px) { .grid > .w2 { grid-column: span 2; } .grid > .w4 { grid-column: span 4; } }
.grid > .tiles.all { grid-template-columns: repeat(auto-fill, minmax(170px, 260px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
/* A long table scrolls inside its card, under a sticky header, so one card never sets a row's height. */
.tall { max-height: min(70vh, 760px); overflow: auto; }
.tall th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
.subgrid { display: grid; gap: 4px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.subgrid > * { min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--ink-2); font-weight: 560; border-bottom: 1px solid var(--axis); padding: 4px 6px; }
td { border-bottom: 1px solid var(--grid); padding: 4px 6px; vertical-align: top; }
td.n, th.n { text-align: right; }
.scroll { overflow-x: auto; max-width: 100%; }
.muted { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 2px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.meter { position: relative; height: 12px; background: var(--grid); border-radius: 6px; margin: 8px 0 4px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--s1); }
.meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
/* A chart never grows past a readable height on a very wide card. */
.grid svg { max-height: 360px; }
svg text { fill: var(--muted); font-size: 11px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 9;
  max-width: 280px; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin: 2px 0; overflow-wrap: anywhere; }
code { font-size: 12px; }
.meter.small { height: 8px; margin: 4px 0 2px; }
.meter .fill.over { background: var(--critical); }
.sev { display: inline-flex; height: 10px; width: 90px; border-radius: 3px; overflow: hidden; vertical-align: -1px; background: var(--grid); }
.sev i { display: block; height: 100%; }
.chips span { display: inline-block; border: 1px solid var(--grid); border-radius: 10px; padding: 0 7px; margin: 1px 4px 1px 0; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
ol.notes { margin: 0; padding-left: 0; list-style: none; } ol.notes li { padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13px; overflow-wrap: anywhere; }
ol.notes .muted { font-size: 12px; }
h3 { font-size: 13px; margin: 12px 0 6px; font-weight: 600; color: var(--ink-2); }
/* The drill-down: a full sheet on a laptop or phone; on a screen 1600px or wider, a drawer taking the
   right 40% while the tab's cards reflow into the rest. */
#drill { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 8; overflow-y: auto; padding: 24px 16px; }
#drill[hidden] { display: none; }
#drill .sheet { background: var(--surface); color: var(--ink); border: 1px solid var(--axis); border-radius: 10px; max-width: 1040px;
  margin: 0 auto; padding: 14px 16px 18px; }
#drill .sheet header { margin-bottom: 8px; }
#drill .note { border-left: 3px solid var(--warning); padding: 2px 8px; color: var(--ink-2); font-size: 13px; margin: 6px 0; }
#drill .tiles { margin-bottom: 14px; }
@media (max-width: 600px) { #drill { padding: 8px 0; } #drill .sheet { border-radius: 0; padding: 12px 16px; } }
@media (min-width: 1600px) {
  #drill { inset: 0 0 0 auto; width: 40vw; background: var(--page); border-left: 1px solid var(--axis); padding: 16px 20px 16px 16px;
    box-shadow: -6px 0 18px rgba(0,0,0,.12); }
  #drill .sheet { max-width: none; }
  :root[data-drill="open"] main { margin-right: 40vw; }
}
/* The review-point filter (§22.4) above a list of tasks or ADRs; rows it hides take no space. */
.rpf { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); margin: -4px 0 8px; }
.rpf select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
  border-radius: 6px; padding: 1px 4px; max-width: 100%; }
[data-rp][hidden] { display: none; }
.goal { white-space: pre-line; overflow-wrap: anywhere; }
[data-drill] { cursor: pointer; }
tr[data-drill]:hover td { background: var(--grid); }
button.link { background: none; border: 0; padding: 0; font: inherit; color: var(--s1); cursor: pointer; text-align: left; }
@media (prefers-reduced-motion: no-preference) { nav.tabs button { transition: color .12s, border-color .12s; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" role="tooltip"></div>
<div id="drill" hidden role="dialog" aria-modal="true" aria-label="Task drill-down"></div>
<script>
const B = /*__BOARD__*/null;
const SEATS = [["implementer", "--s1"], ["reviewer", "--s2"], ["verifier", "--s3"], ["runner", "--s4"],
               ["design-seat", "--s5"], ["other seats", "--s6"], ["unattributed", "--other"]];
// Named seats keep their own slot; any other attributed bucket (a teammate, a run with no seat) is "other seats".
const NAMED = ["implementer", "reviewer", "verifier", "runner", "design-seat"];
const bucket = (day, s) => s === "unattributed" ? (day.unattributed || 0)
  : s === "other seats" ? Object.entries(day).filter(([k]) => !NAMED.includes(k) && k !== "unattributed").reduce((a, [, v]) => a + v, 0)
  : (day[s] || 0);
const TOK = ["input_tokens", "output_tokens", "cache_read_tokens", "cache_creation_tokens"];
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmtTok = (n) => n == null ? "–" : n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const fmtH = (s) => s == null ? "–" : s >= 3600 ? (s / 3600).toFixed(1) + "h" : Math.round(s / 60) + "m";
const sum = (o) => TOK.reduce((a, k) => a + (o?.[k] || 0), 0);
const seatOf = (k) => SEATS.find(([n]) => n === k) ? k : "unattributed";
const ago = (iso) => { if (!iso) return "–"; const m = (Date.now() - Date.parse(iso)) / 60000;
  return m < 1 ? "just now" : m < 60 ? Math.round(m) + " min ago" : m < 1440 ? (m / 60).toFixed(1) + " h ago" : (m / 1440).toFixed(1) + " d ago"; };
const tip = document.getElementById("tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 12, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.style.display = "none"; }

// §28.1 Now: one row per live seat, its pinned and observed model and effort (ccp/seats.py).
function seatsCard(S) {
  if (!S) return "";
  const mo = (m, e) => `${esc(m || "–")} · ${esc(e || "–")}`;
  let body;
  if (S.error) body = `<div class="banner critical" role="status"><b>⚠ Seats failed</b><span>${esc(S.error)}</span></div>`;
  else {
    body = "";
    body += `<div class="scroll"><table style="min-width:900px"><tr><th>Team</th><th>Seat</th><th>Status</th><th>Since</th><th>Pinned</th><th>Observed</th><th>Check</th><th>Last activity</th></tr>
    ${(S.rows || []).map((r) => { const e = r.expected || {}, o = r.observed, mm = r.mismatch || [];
      const check = mm.length ? `<b style="color:var(${e.advisory ? "--serious" : "--critical"})">⚠ ${e.advisory ? "advice: " : ""}${esc(mm.join("; "))}</b>` : o && (e.model || e.effort) ? `<span style="color:var(--good)">✓ as pinned</span>` : `<span class="muted">–</span>`;
      const la = r.last_activity;
      return `<tr><td>${esc(r.team)}</td><td>${esc(r.seat)}</td><td>${esc(r.status)}${r.stale ? ` <b style="color:var(--serious)">⚠ ${esc(r.stale)}</b>` : ""}</td><td style="white-space:nowrap">${r.since ? esc(ago(r.since)) : "–"}</td>
        <td title="${esc(e.source || "")}">${e.model || e.effort ? mo(e.model, e.effort) : `<span class="muted">${esc(e.source || "–")}</span>`}${e.advisory ? ' <span class="muted">(advisory)</span>' : ""}</td>
        <td>${o ? mo(o.model, o.effort) + (o.other_models?.length ? ` <span class="muted">also ${esc(o.other_models.join(", "))}</span>` : "") : `<span class="muted">${esc(r.observed_note || "–")}</span>`}</td>
        <td>${check}${(r.notes || []).map((x) => `<div class="muted">${esc(x)}</div>`).join("")}</td><td style="white-space:nowrap" title="${esc(la?.source || "")}">${la ? esc(ago(la.at)) + ` <span class="muted">${esc(la.source || "")}</span>` : "–"}</td></tr>`; }).join("")}
    </table></div><p class="meta">Pinned: the definitions, the run records, <code>telemetry.design_seat</code> and the headless flags (hover for the source). Observed: the seat's latest requests in the telemetry, the model with most tokens within ${esc(S.window_minutes)} min of its last one${S.telemetry ? "" : ". No telemetry has been received for this project yet"}.</p>`;
  }
  return `<section class="card"><h2>Seats</h2>${body}</section>`;
}
function legend(items) { return `<div class="legend">${items.map(([n, v]) => `<span><i style="background:var(${v})"></i>${esc(n)}</span>`).join("")}</div>`; }

// Charts draw in CSS pixels: each records draw(W) and its hover binding, and fitCharts() redraws
// it at its container's width once the page is laid out and whenever that width changes, so axis
// text stays 11px in a narrow card and a wide card gets a wide chart (heights stay fixed).
const CHARTS = [];
function chart(id, draw, bind, W) { CHARTS.push({id, draw, bind, w: W}); setTimeout(bind, 0); return draw(W); }
function fitCharts() {
  for (const c of CHARTS) { const el = document.getElementById(c.id), w = el ? Math.round(el.clientWidth || 0) : 0;
    if (w < 120 || Math.abs(w - c.w) < 4) continue;
    c.w = w; el.innerHTML = c.draw(w); c.bind(); }
}

function stackedDays(daily) {
  const days = Object.keys(daily || {}).sort().slice(-14);
  if (!days.length) return `<p class="muted">No usage recorded yet. It starts once the user settings (<code>~/.claude/settings.json</code>) carry <code>ccp otel env</code> and the receiver runs.</p>`;
  const totals = days.map((d) => SEATS.reduce((a, [s]) => a + bucket(daily[d], s), 0));
  const draw = (W) => {
  const H = 220, L = 48, Bm = 22, T = 8, bw = Math.max(6, Math.min(40, (W - L) / days.length - 6));
  const max = Math.max(...totals, 1), y = (v) => T + (H - T - Bm) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = max * i / 3, yy = y(v);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtTok(v)}</text>`; }
  days.forEach((d, i) => {
    const x = L + 4 + i * ((W - L - 4) / days.length);
    let acc = 0;
    SEATS.forEach(([s, v]) => {
      const val = bucket(daily[d], s);
      if (!val) return;
      const y0 = y(acc), y1 = y(acc + val); acc += val;
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="var(${v})" stroke="var(--surface)" stroke-width="2" rx="2"/>`;
    });
    g += `<rect class="hit" data-i="${i}" x="${x - 2}" y="${T}" width="${bw + 4}" height="${H - T - Bm}" fill="transparent"/>`;
    if (days.length <= 8 || i % (W < 700 ? 3 : 2) === days.length % (W < 700 ? 3 : 2)) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.slice(5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens per day by seat">${g}</svg>`; };
  const bind = () => document.querySelectorAll("#days .hit").forEach((r) => {
    const d = days[+r.dataset.i];
    r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(d)}</b><br>` + SEATS.map(([s]) => {
      const v = bucket(daily[d], s);
      return v ? `${esc(s)}: ${fmtTok(v)}` : ""; }).filter(Boolean).join("<br>") + `<br><b>total ${fmtTok(totals[+r.dataset.i])}</b>`));
    r.addEventListener("mouseleave", hideTip); });
  const table = `<details><summary>Table</summary><div class="scroll"><table><tr><th>Day</th>${SEATS.map(([s]) => `<th class="n">${s}</th>`).join("")}<th class="n">total</th></tr>${days.map((d, i) => `<tr><td>${esc(d)}</td>${SEATS.map(([s]) => `<td class="n">${fmtTok(bucket(daily[d], s))}</td>`).join("")}<td class="n">${fmtTok(totals[i])}</td></tr>`).join("")}</table></div></details>`;
  return `<div id="days">${chart("days", draw, bind, 1100)}</div>${legend(SEATS.map(([s, v]) => [s, v]))}${table}`;
}

// §28.1 drill-down (ccp/drill.py): each task's wall time split, in fixed slot order.
const SPLIT = [["model", "model_s", "--s1"], ["suite", "suite_s", "--s2"], ["other tools", "other_s", "--s3"],
               ["idle", "idle_s", "--s4"], ["runner, between runs", "runner_s", "--s5"], ["unmeasured", "unknown_s", "--other"], ["live, no telemetry yet", "live_s", "--axis"]];
const SEGK = {m: "--s1", s: "--s2", o: "--s3", i: "--s4", u: "--other", l: "--axis"};
const fmtD = (s) => s == null || isNaN(s) ? "–" : s >= 3600 ? (s / 3600).toFixed(1) + "h" : s >= 60 ? Math.round(s / 60) + "m" : Math.round(s) + "s";

const SEV = [["critical", "--critical"], ["high", "--serious"], ["medium", "--warning"], ["low", "--s1"], ["info", "--other"]];

    </div><div><h3>Warm suite seconds per task (modules cached; not the suite's time)</h3>${bars(suiteWarm, {fmt: fmtS, color: "--s2", col: "task", unit: "seconds", label: "Warm suite seconds per task", empty: "No warm suite runs recorded."})}

// §28 priority 5, §22.10: Plan and backlog (ccp/plan.py). Every string from a task or an ADR goes through esc().
function burnup(days) {
  if (!days || days.length < 2) return `<p class="muted">Burn-up draws from the second day of the task log.</p>`;
  const max = Math.max(...days.map((d) => d.total), 1);
  const draw = (W) => { const H = 220, L = 40, Bm = 20, T = 10;
  const x = (i) => L + 4 + i * (W - L - 8) / (days.length - 1), y = (v) => T + (H - T - Bm) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = Math.round(max * i / 3), yy = y(v);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`; }
  const line = (k, c, dash) => `<polyline fill="none" stroke="var(${c})" stroke-width="2"${dash ? ' stroke-dasharray="5 4"' : ""} points="${days.map((d, i) => `${x(i)},${y(d[k])}`).join(" ")}"/>`;
  g += line("total", "--ink-2", true) + line("done", "--s1", false);
  const step = (W - L - 8) / (days.length - 1);
  days.forEach((d, i) => { g += `<rect class="hit" data-i="${i}" x="${x(i) - step / 2}" y="${T}" width="${step}" height="${H - T - Bm}" fill="transparent"/>`; });
  g += `<text x="${L + 4}" y="${H - 4}">${esc(days[0].date.slice(5))}</text><text x="${W}" y="${H - 4}" text-anchor="end">${esc(days[days.length - 1].date.slice(5))}</text>`;
  const last = days[days.length - 1];
  g += `<text x="${W - 4}" y="${y(last.done) - 6}" text-anchor="end" style="fill:var(--ink-2)">${last.done} done</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks done against tasks in the log, per day">${g}</svg>`; };
  const bind = () => document.querySelectorAll("#burnup .hit").forEach((r) => { const d = days[+r.dataset.i];
    r.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(d.date)}</b><br>done ${d.done} of ${d.total}`));
    r.addEventListener("mouseleave", hideTip); });
  const table = `<details><summary>Table</summary><div class="scroll"><table><tr><th>Day</th><th class="n">done</th><th class="n">in the log</th></tr>${days.slice().reverse().map((d) => `<tr><td>${esc(d.date)}</td><td class="n">${d.done}</td><td class="n">${d.total}</td></tr>`).join("")}</table></div></details>`;
  return `<div id="burnup">${chart("burnup", draw, bind, 640)}</div>${legend([["done", "--s1"], ["in the log (not dropped), dashed", "--ink-2"]])}${table}`;
}

// Open tasks in rows by depth (a task sits below every open task it waits on), five to a row, so it
// stays legible at phone width; a list beside it carries the same facts as text.
function depGraph(G) {
  if (!G || !G.nodes.length) return `<p class="muted">No open tasks.</p>`;
  const NW = 62, NH = 20, GX = 8, PER = 5, RH = 34, W = PER * NW + (PER - 1) * GX, pos = {};
  let row = 0, g = "";
  const depths = [...new Set(G.nodes.map((n) => n.depth))].sort((a, b) => a - b);
  for (const d of depths) {
    const ns = G.nodes.filter((n) => n.depth === d);
    ns.forEach((n, i) => { pos[n.id] = {x: (i % PER) * (NW + GX), y: (row + Math.floor(i / PER)) * RH + 4}; });
    row += Math.ceil(ns.length / PER);
  }
  const H = row * RH + 4;
  for (const [a, b] of G.edges) { const p = pos[a], q = pos[b]; if (!p || !q) continue;
    g += `<line x1="${p.x + NW / 2}" y1="${p.y + NH}" x2="${q.x + NW / 2}" y2="${q.y}" stroke="var(--axis)" stroke-width="1"/>`; }
  for (const n of G.nodes) { const p = pos[n.id];
    const fill = n.in_flight ? "var(--s1)" : n.ready ? "var(--s3)" : "var(--surface)";
    const ink = n.in_flight || n.ready ? "#fff" : "var(--ink)";
    const mark = n.in_flight ? "▶ " : n.ready ? "✓ " : "";
    g += `<g><title>${esc(n.id)} · ${esc(n.title)}${n.waiting_on.length ? " · waits on " + esc(n.waiting_on.map((x) => x.slice(0, 4)).join(", ")) : ""}</title>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="4" fill="${fill}" stroke="${n.kind === "refactor" ? "var(--s4)" : "var(--axis)"}" stroke-width="${n.kind === "refactor" ? 2 : 1}"${n.in_scope === false ? ' stroke-dasharray="3 2" opacity="0.6"' : ""}/>
      <text x="${p.x + NW / 2}" y="${p.y + 14}" text-anchor="middle" style="fill:${ink};font-size:11px">${mark}${esc(n.id.slice(0, 4))}</text></g>`; }
  const list = `<details><summary>As a list</summary><ul class="plain">${G.nodes.map((n) => `<li><code>${esc(n.id.slice(0, 4))}</code> ${esc(n.title)} <span class="muted">(${n.in_flight ? "in flight" : n.ready ? "ready" : n.waiting_on.length ? "waits on " + esc(n.waiting_on.map((x) => x.slice(0, 4)).join(", ")) : esc(n.status)}${n.kind === "refactor" ? ", refactor" : ""}${n.in_scope === false ? ", outside the scope" : ""}${n.done_deps ? ", " + n.done_deps + " done dep(s)" : ""})</span></li>`).join("")}</ul></details>`;
  return `<svg viewBox="-2 0 ${W + 4} ${H}" style="max-width:560px" role="img" aria-label="Open tasks and their open dependencies">${g}</svg>
    ${legend([["▶ in flight", "--s1"], ["✓ ready", "--s3"], ["waiting (outlined)", "--axis"], ["refactor (amber edge)", "--s4"]])}<p class="meta">Dashed and faded: outside the runner's scope. Hover a task for its title and what it waits on.</p>
    ${G.truncated ? `<p class="muted">The first ${G.nodes.length} of ${G.open} open tasks.</p>` : ""}${list}`;
}

// Returns the Queue tab's cards and the Backlog tab's; a section error shows on the tab it belongs to.
// §22.7: the review-point filter. CUR_RP is the current point; each select names its rows' container.
let CUR_RP = null;
function applyRpf(key, v) {
  const want = v === "current" ? CUR_RP : v;
  document.querySelectorAll(`[data-rpf-rows="${key}"] [data-rp]`).forEach((r) => {
    const have = (r.getAttribute("data-rp") || "").split(" ").filter(Boolean);
    r.hidden = !(v === "all" || (v === "none" ? !have.length : have.includes(want)));
  });
}
function restoreRpf() {
  document.querySelectorAll("select[data-rpf]").forEach((sel) => {
    let v = null; try { v = localStorage.getItem("board-rpf-" + sel.getAttribute("data-rpf")); } catch (e) {}
    if (v && Array.from(sel.options || []).some((o) => o.value === v)) { sel.value = v; applyRpf(sel.getAttribute("data-rpf"), v); }
  });
}
function plan(P) {

  for (const [k, e] of Object.entries(P.errors || {})) { const b = `<div class="banner critical all" role="status"><b>⚠ ${esc(NAMES[k] || k)} section failed</b><span>${esc(e)}</span></div>`;
    if (ON_QUEUE.includes(k) || !ON_BACKLOG.includes(k)) html += b;

  const R = P.ready || {}, items = R.items || [], A = P.adrs, RP = P.review_points || [], cur = RP.find((g) => g.current);
  CUR_RP = cur ? cur.id : (REG.current || null);
  const rpName = (id) => { const g = RP.find((x) => x.id === id); return g && g.name ? String(g.name) : ""; };
  const rpLabel = (id) => id ? esc(id) + (rpName(id) ? " · " + esc(rpName(id)) : "") : "–";
  const short = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const rpSel = (key) => `<label class="rpf">Review point <select data-rpf="${key}"><option value="all">All</option>${CUR_RP ? `<option value="current">Current (${esc(CUR_RP)})</option>` : ""}${RP.slice().reverse().map((g) => `<option value="${esc(g.id)}">${rpLabel(g.id)}</option>`).join("")}<option value="none">None</option></select></label>`;
  const adrs = (A?.items || []), built = adrs.filter((i) => i.built_pct != null);

      <div class="meter" aria-hidden="true"><div class="fill" style="width:${Math.min(100, seven || 0)}%"></div>${cp != null ? `<div class="mark" style="left:${cp}%"></div>` : ""}</div>
      <div class="d">checkpoint ${cp ?? "–"}%${a.decision_lapsed_at ? ` · decision lapsed at the counter reset ${esc(String(a.decision_lapsed_at).slice(0, 16).replace("T", " "))}` : ""} · ${last.resets_at ? "resets " + new Date(last.resets_at).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"}) : "reset unknown"}</div>
      ${(() => { try { const t = fcAllowLine(B.forecast, true); return t ? `<div class="d" title="estimate, advisory (SPEC §26.4)">${t}</div>` : ""; } catch (e) { return ""; } })()}</div>
    <div class="tile"><div class="k">Tokens, last 7 days</div><div class="v">${fmtTok(weekTok)}</div><div class="d">cost estimate $${(u.total?.cost_usd ?? 0).toFixed(2)} all time</div></div>
    <div class="tile"><div class="k">Attributed to runs or seats</div><div class="v">${u.coverage == null ? "–" : (u.coverage * 100).toFixed(1) + "%"}</div><div class="d">${u.traces ? "from trace spans" : "no traces: time windows only"}</div></div>
    <div class="tile"><div class="k">Tasks merged, 7 days</div><div class="v">${merged7}</div><div class="d">median wall ${fmtH(tr.median_wall_s_last10)} (prior 10: ${fmtH(tr.median_wall_s_prior10)})</div></div>
    <div class="tile"><div class="k">Review + verify rounds</div><div class="v">${tr.median_review_verify_rounds ?? "–"}</div><div class="d">median per task</div></div>
    <div class="tile"><div class="k">Tokens per task</div><div class="v">${fmtTok(tr.median_tokens_per_task)}</div><div class="d">median, tasks with usage</div></div>
    ${rw ? `<div class="tile" title="${esc(rw.ids.join(", "))}"><div class="k">Refactors waiting</div><div class="v">${rw.count}</div><div class="d">${rw.count ? `oldest ${esc(rw.oldest_task_id || "?")} · ${rw.oldest_age_days == null ? "age unknown" : rw.oldest_age_days.toFixed(0) + " d"}` : "none waiting"}${rw.count && rw.mode === "deps" ? " · the next review point takes them" : ""}</div></div>` : ""}
  </div>`);
  top += `<div class="strip">${bans ? `<div>${bans}</div>` : ""}<div class="row">${tiles}${safe("Now", () => nowStrip(n, w, B.plan))}</div></div>`;

  // Performance tab. Cards added after the wall-time card land here too.
  const perf_html = tabSafe("Performance", () => { let html = safe("Seats", () => seatsCard(n.seats)).replace('<section class="card">', '<section class="card s3">');
  html += safe("Tokens by seat", () => `<section class="card"><h2>Tokens by seat</h2><div class="scroll"><table><tr><th>Seat</th><th class="n">input</th><th class="n">output</th><th class="n">cache read</th><th class="n">cache write</th><th class="n">calls</th><th class="n">cost</th></tr>
    ${Object.entries(u.seats || {}).map(([s, v]) => `<tr><td>${esc(s)}</td><td class="n">${fmtTok(v.input_tokens)}</td><td class="n">${fmtTok(v.output_tokens)}</td><td class="n">${fmtTok(v.cache_read_tokens)}</td><td class="n">${fmtTok(v.cache_creation_tokens)}</td><td class="n">${v.requests}</td><td class="n">${v.cost_usd == null ? "–" : "$" + Number(v.cost_usd).toFixed(2)}</td></tr>`).join("")}
    <tr><td class="muted">unattributed</td><td class="n">${fmtTok(u.unattributed?.input_tokens)}</td><td class="n">${fmtTok(u.unattributed?.output_tokens)}</td><td class="n">${fmtTok(u.unattributed?.cache_read_tokens)}</td><td class="n">${fmtTok(u.unattributed?.cache_creation_tokens)}</td><td class="n">${u.unattributed?.requests ?? 0}</td><td class="n">${u.unattributed?.cost_usd == null ? "–" : "$" + Number(u.unattributed.cost_usd).toFixed(2)}</td></tr>
  </table></div><p class="meta">Cost: an estimate at list prices, $${(u.total?.cost_usd ?? 0).toFixed(2)} in all.</p></section>`);
  html += safe("Tokens per day", () => `<section class="card s2"><h2>Tokens per day, by seat</h2>${stackedDays(u.daily)}</section>`);
  html += safe("Wall time per task", () => `<section class="card s2"><h2>Wall time per task, last 30 merged</h2>${wallBars(B.tasks)}
    ${B.drill && B.drill._error ? `<div class="banner critical" role="status"><b>⚠ Drill-down failed</b><span>${esc(B.drill._error)}</span></div>` : `<p class="meta">Click a bar or a row for that task's runs on a time axis. Model, suite, other tools and idle are measured inside runs from 2026-10-21 (telemetry from its evening); runner is the time between runs.</p>`}
    <details><summary>Per-task table</summary><div class="scroll tall"><table style="min-width:980px"><tr><th>Task</th><th>Merged</th><th class="n">wall</th><th class="n">impl</th><th class="n">review</th><th class="n">verify</th><th class="n">model</th><th class="n">suite</th><th class="n">other</th><th class="n">idle</th><th class="n">runner</th><th class="n">rounds r/v/f</th><th class="n">lines</th><th class="n">tokens</th><th>flags</th></tr>
    ${B.tasks.slice().reverse().map((t) => { const D = drillOf(t.task_id), sp = D && D.telemetry === "runs" ? D.split : null, c = (k) => sp ? fmtD(sp[k]) : "–";
      return `<tr${drillAttr(t.task_id)}><td>${D ? `<button class="link" type="button">${esc(t.task_id)}</button>` : esc(t.task_id)}</td><td>${esc((t.merged_at || "").slice(0, 16).replace("T", " "))}</td><td class="n">${fmtH(t.wall_s)}</td><td class="n">${fmtH(t.implementing_s)}</td><td class="n">${fmtH(t.reviewing_s)}</td><td class="n">${fmtH(t.verifying_s)}</td><td class="n">${c("model_s")}</td><td class="n">${c("suite_s")}</td><td class="n">${c("other_s")}</td><td class="n">${c("idle_s")}</td><td class="n">${D && D.runs && D.runs.length ? fmtD(D.split.runner_s) : "–"}</td><td class="n">${t.review_rounds ?? "–"}/${t.verify_rounds ?? "–"}/${t.fix_rounds ?? "–"}</td><td class="n">${t.lines ?? "–"}</td><td class="n">${fmtTok(Object.values(t.tokens || {}).reduce((a, b) => a + b, 0) || null)}</td><td>${esc((t.flags || []).join("; "))}</td></tr>`; }).join("")}
    </table></div></details></section>`);
  html += safe("Runs with usage", () => { const runsRows = (B.runs || []).slice(-40).reverse();
  return `<section class="card s2"><h2>Runs with usage</h2>${runsRows.length ? `<div class="scroll tall"><table><tr><th>Run</th><th>Seat</th><th>Pinned</th><th>Observed</th><th class="n">tokens</th><th class="n">calls</th></tr>
    ${runsRows.map((r) => `<tr><td>${esc(r.run_id)}</td><td>${esc(r.seat)}</td><td>${esc(r.expected_model || "–")} · ${esc(r.expected_effort || "–")}</td><td>${esc(r.usage.observed_models.join(", ") || "–")} · ${esc(r.usage.observed_efforts.join(", ") || "–")}${r.flags.length ? ` <b style="color:var(--critical)">⚠ ${esc(r.flags.join("; "))}</b>` : ""}</td><td class="n">${fmtTok(sum(r.usage))}</td><td class="n">${r.usage.requests}</td></tr>`).join("")}
    </table></div>` : `<p class="muted">No run has usage yet.</p>`}</section>`; });
  html += safe("Suite and prompt", () => suiteCard(B.quality, B.tasks));
  html += safe("Headless runs", () => { const hl = (B.headless || []).slice(-20).reverse();
  return hl.length ? `<section class="card"><h2>Headless runs</h2><div class="scroll"><table><tr><th>When</th><th>Kind</th><th class="n">turns</th><th class="n">time</th><th class="n">cost</th></tr>
    ${hl.map((x) => `<tr title="${esc(x.review_id || "")}"><td style="white-space:nowrap">${esc(String(x.at || "").slice(0, 16).replace("T", " "))}</td><td>${esc(x.kind || "–")}</td><td class="n">${esc(x.num_turns ?? "–")}</td><td class="n">${x.duration_ms == null ? "–" : fmtD(Number(x.duration_ms) / 1000)}</td><td class="n">${x.total_cost_usd == null ? "–" : "$" + (Number(x.total_cost_usd) || 0).toFixed(2)}</td></tr>`).join("")}
    </table></div></section>` : ""; });
  return html; });

  // Quality tab.
  const quality_html = tabSafe("Quality", () => (quality(B.quality, B.tasks) || `<p class="muted all">No quality data in this board.</p>`)
    + safe("Estimation", () => estimationCard(B.estimates)));

  // Queue and Backlog tabs (the plan section).
  let PL;
  try { PL = plan(B.plan); } catch (e) { const b = `<div class="banner critical all" role="status"><b>⚠ Plan section failed</b><span>${esc(e && e.message || e)}</span></div>`; PL = {queue: b, backlog: b}; }
  const queue_html = tabSafe("Queue", () => (PL.queueTiles || "") + safe("Now, in detail", () => `<section class="card"><h2>Now, in detail</h2><table>
    <tr><td>Runner</td><td>${esc(w.status || "–")}${w.review_point ? " · " + rpText(w.review_point, B.plan) : ""} · scope ${n.scope_size} · done since spawn ${w.runner_tasks_done ?? 0}</td></tr>
    <tr><td>Task</td><td>${w.task_id && drillOf(w.task_id) ? `<button class="link" type="button"${drillAttr(w.task_id)}>${esc(w.task_id)}</button>` : esc(w.task_id || "–")}</td></tr>
    ${(n.held || []).length ? `<tr><td>Held</td><td>${n.held.map((h) => `${esc(h.task_id)} <span class="muted">(${esc([h.by || "?", h.reason].filter(Boolean).join(", "))})</span>`).join("<br>")}</td></tr>` : ""}
    ${n.next_tasks && Array.isArray(n.next_tasks.tasks) && n.next_tasks.tasks.length ? `<tr><td>Next</td><td>${n.next_tasks.tasks.map(esc).join(" → ")} <span class="muted">(${esc([n.next_tasks.by || "?", n.next_tasks.reason].filter(Boolean).join(", "))})</span></td></tr>` : ""}
    <tr><td>Phase</td><td>${esc(w.phase || "–")} ${w.phase_since ? "· " + ago(w.phase_since) : ""}</td></tr>
    <tr><td>Workers</td><td>${n.open_runs.length ? n.open_runs.map((r) => `${esc(r.run_id)} <span class="muted">(${esc(r.state)})</span>`).join("<br>") : "–"}</td></tr>
    <tr><td>Waiting</td><td>${[...n.waits.map((x) => `${esc(x.task_id)} on ${esc(x.waiting_on)}`), ...n.gates.map((g) => `gate ${esc(g.id)} (${esc(g.class)})`), ...n.questions.map((q) => `question ${esc(q.id)}`)].join("<br>") || "nothing"}</td></tr>
  </table></section>`) + safe("Forecast", () => forecastCard(B.forecast)) + (PL.queue || `<p class="muted all">No plan data in this board.</p>`)
    + safe("Refactors waiting", () => rw && rw.count ? `<section class="card"><h2>Refactors waiting</h2><p>${rw.ids.map((x) => `<code>${esc(x)}</code>`).join(", ")}</p><p class="meta">Outside the scope${rw.mode === "deps" ? "; the next review point takes them" : ""}.</p></section>` : ""));

  // Plane health tab: the plane's own housekeeping.
  const health_html = tabSafe("Plane health", () => safe("Plane health", () => `<section class="card s2"><h2>Plane health</h2><div class="cols"><div><table><tr><th>Source</th><th class="n">updated</th></tr>
    ${Object.entries(h.sources || {}).map(([k, v]) => `<tr><td>${esc(k)}${(h.stale_sources || []).includes(k) ? ' <b style="color:var(--critical)">⚠ stale</b>' : v.live ? ` <span class="muted">${esc(v.live)}</span>` : ""}</td><td class="n">${v.age_minutes == null ? "never" : v.age_minutes < 60 ? Math.round(v.age_minutes) + " min" : (v.age_minutes / 60).toFixed(1) + " h"}</td></tr>`).join("")}</table></div>
    <div><ul class="plain">
      <li>Attribution: ${Object.entries(u.how || {}).map(([k, v]) => `${esc(k)} ${v}`).join(" · ") || "–"}</li>
      ${Object.keys(u.unattributed_sources || {}).length ? `<li>Unattributed by agent: ${Object.entries(u.unattributed_sources).map(([k, v]) => `<code>${esc(k)}</code> ×${v}`).join(", ")}</li>` : ""}
      <li>Queue scripts that are not the plane's: ${(h.scripts || []).length ? (h.scripts || []).map((s) => `<code>${esc(s.replace(/ differs from.*$/, "").replace(/^(unknown|drifted): scripts\//, (m, k) => k + " "))}</code>`).join(", ") : "none"}</li>
      <li>Open ccp proposals: ${(h.proposals_open || []).length ? h.proposals_open.map((p) => `${esc(p.need)} <span class="muted">(×${p.again + 1})</span>`).join("; ") : "none"}</li>
      <li>Queue vs task log: ${(h.divergence || []).length ? h.divergence.map(esc).join("; ") : "in agreement"}</li>
      <li>Headless runs recorded: ${(B.headless || []).length}</li>
      <li>Last rebuild failure: ${h.last_rebuild_failure ? esc(typeof h.last_rebuild_failure === "string" ? h.last_rebuild_failure : JSON.stringify(h.last_rebuild_failure)) : "none"}</li>
    </ul></div></div></section>`) + safe("Allowance", () => { const dec = Array.isArray(a.decisions) ? a.decisions : [];
  return `<section class="card"><h2>Allowance</h2><ul class="plain"><li>Weekly: <b>${seven == null ? "?" : seven.toFixed(0) + "%"}</b> · 5-hour: ${last.five_hour == null ? (seven != null ? "no limit" : "?") : Number(last.five_hour).toFixed(0) + "%"} · read ${last.at ? esc(ago(last.at)) : "never"}</li>
    <li>Checkpoint in force: ${cp ?? "–"}%${a.project_checkpoint != null ? ` <span class="muted">(project's own ${esc(a.project_checkpoint)}%)</span>` : ""}${a.decision_lapsed_at ? ` · decision lapsed at the counter reset ${esc(String(a.decision_lapsed_at).slice(0, 16).replace("T", " "))}` : ""}</li>
    ${safe("Allowance fit", () => allowanceFitLines(B.forecast))}</ul>
    <h3>Checkpoint decisions this week</h3>${dec.length ? `<ol class="notes">${dec.slice().reverse().map((d) => `<li><span class="muted">${esc(String(d.at || "").slice(0, 16).replace("T", " "))} · ${esc(d.by || "-")} · to ${esc(d.to ?? "–")}% at ${esc(d.seven_day_then ?? "–")}%${d.lapsed_at ? ` · lapsed at the counter reset ${esc(String(d.lapsed_at).slice(0, 16).replace("T", " "))}` : ""}</span><br>${esc(d.reason || "")}</li>`).join("")}</ol>` : `<p class="muted">None.</p>`}</section>`; }));

  // Tab badges: a count where it helps the choice of tab.
  const Q = B.quality || {}, P = B.plan || {}, S = n.seats || {};
  const count = (f) => { try { return Number(f()) || 0; } catch (e) { return 0; } };
  const ready = count(() => ((P.ready || {}).items || []).filter((t) => !t.in_flight).length);
  const triage = count(() => ((Q.architect || {}).awaiting_triage || []).length);
  const seatWarn = count(() => (S.error ? 1 : 0) + (Array.isArray(S.rows) ? S.rows.filter((r) => (r.mismatch || []).length).length : 0));
  const healthWarn = count(() => (h.stale_sources || []).length + (h.scripts || []).length + (h.divergence || []).length + (h.last_rebuild_failure ? 1 : 0));
  const BADGE = {performance: [seatWarn, true], quality: [triage, true], backlog: [0, false], queue: [ready, false], health: [healthWarn, true]};
  const TITLE = {performance: "seats off their pin", quality: "reports awaiting triage", queue: "tasks ready", health: "plane warnings"};
  const nav = `<nav class="tabs" role="tablist" aria-label="Board sections">${TABS.map(([k, label], i) => { const [c, warn] = BADGE[k];
    return `<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-controls="pane-${k}" aria-selected="${k === CUR_TAB}" tabindex="${k === CUR_TAB ? 0 : -1}"><kbd>${i + 1}</kbd>${label}${c ? ` <span class="badge${warn ? " warn" : ""}" title="${c} ${TITLE[k]}">${c}</span>` : ""}</button>`; }).join("")}<span class="hint">keys 1–5</span></nav>`;
  const pane = (k, body) => `<div class="pane grid" id="pane-${k}" data-tab="${k}" role="tabpanel" aria-labelledby="tab-${k}"${k === CUR_TAB ? "" : " hidden"}>${body}</div>`;
  const html = top + nav + pane("performance", perf_html) + pane("quality", quality_html) + pane("backlog", tabSafe("Backlog", () => PL.backlog || `<p class="muted all">No plan data in this board.</p>`))
    + pane("queue", queue_html) + pane("health", health_html);
  document.getElementById("app").append($(html));
  const app = document.getElementById("app"), panel = document.getElementById("drill");
  app.addEventListener("click", (e) => { const c = e.target && e.target.closest ? e.target : null;
    const tb = c && c.closest("nav.tabs [data-tab]"); if (tb) { showTab(tb.dataset.tab); return; }
    const t = c && c.closest("[data-drill]"); if (t) openDrill(DRILL_IDS[+t.getAttribute("data-drill")]); });
  app.addEventListener("change", (e) => { const sel = e.target && e.target.closest ? e.target.closest("select[data-rpf]") : null;
    if (!sel) return; const k = sel.getAttribute("data-rpf"); applyRpf(k, sel.value);
    try { localStorage.setItem("board-rpf-" + k, sel.value); } catch (er) {} relayout(); });
  try { restoreRpf(); } catch (e) {}
  if (panel) panel.addEventListener("click", (e) => { if (e.target === panel || (e.target.closest && e.target.closest("[data-close]"))) closeDrill(); });
  if (typeof addEventListener === "function") {
    addEventListener("keydown", (e) => {
      if (e.key === "Escape" && panel && !panel.hidden) { closeDrill(); return; }
      if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "")) return;
      const i = "12345".indexOf(e.key);
      if (i >= 0 && e.key.length === 1) { showTab(TAB_KEYS[i]); return; }
      if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && e.target && e.target.getAttribute && e.target.getAttribute("role") === "tab") {
        const j = (TAB_KEYS.indexOf(CUR_TAB) + (e.key === "ArrowRight" ? 1 : TAB_KEYS.length - 1)) % TAB_KEYS.length;
        showTab(TAB_KEYS[j]); const b = document.getElementById("tab-" + TAB_KEYS[j]); if (b && b.focus) b.focus(); }
    });
    // The page reloads every minute: keep the tab, each tab's scroll and the drill-down's scroll.
    addEventListener("pagehide", () => { try { SCROLL[CUR_TAB] = scrollY;
      sessionStorage.setItem("board-scroll", JSON.stringify({tabs: SCROLL, drill: panel && !panel.hidden ? panel.scrollTop : 0})); } catch (e) {} });
  }
  writeHash();
  try { relayout(); if (typeof ResizeObserver === "function") new ResizeObserver(() => relayout()).observe(app); } catch (e) {}
  if (typeof location !== "undefined" && hp.task) {  // the page reloads every minute: keep the open drill-down
    try { openDrill(hp.task); } catch (e) {} }
  try { const sv = JSON.parse(sessionStorage.getItem("board-scroll") || "null");
    if (sv && sv.tabs) { Object.assign(SCROLL, sv.tabs); if (typeof SCROLL[CUR_TAB] === "number") scrollTo(0, SCROLL[CUR_TAB]); }
    if (sv && sv.drill && panel && !panel.hidden) panel.scrollTop = sv.drill; } catch (e) {}
  document.getElementById("theme").addEventListener("click", () => {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("board-theme", r.dataset.theme); } catch (e) {} });
}
try { const t = localStorage.getItem("board-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
render();
</script>
</body>
</html>
