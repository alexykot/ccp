review_points:
  - id: R1
    name: publishable
    goal: The repository can be published. The SPEC is restructured into normative rules, the privacy scrub is done, and the leak check passes with a full denylist.
    status: closed
    opened: "2026-11-05"
    closed: "2026-11-10"
  - id: R2
    name: delivery refinements
    goal: Generic delivery improvements raised by managed products' tool proposals and accepted in triage, built once the repository is publishable.
    status: closed
    opened: "2026-11-10"
    closed: "2026-11-10"
  - id: R3
    name: proposal intake
    goal: Generic concerns found written into a managed product's own docs and tools move into the plane - gate stages, doc conventions, separation of duties, operator sign-off and notification, worker and lead rules, release safety and mutation checks.
    status: closed
    opened: "2026-11-10"
    closed: "2026-11-11"
  - id: R4
    name: follow-ups
    goal: Fixes and follow-ups found while delivering R1–R3, and generic needs raised since.
    status: closed
    opened: "2026-11-11"
    closed: "2026-11-12"
  - id: R5
    name: adoption and follow-ups
    goal: Make adopting the plane on a new product smooth, add the tools products asked for, and close the follow-ups found while delivering R1–R4.
    status: closed
    opened: "2026-11-12"
    closed: "2026-11-16"
  - id: R6
    name: follow-ups II
    goal: Close the follow-ups found while delivering R5, make worker prompts arrive whole, and record a check that cannot hold as written.
    status: closed
    opened: "2026-11-16"
    closed: "2026-11-17"
  - id: R7
    name: upgrades and speed
    goal: Products learn what each release asks of them, operator sign-off moves to tasking, and the gate gets faster.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-17"
  - id: R8
    name: adoption and follow-ups III
    goal: Every opt-in feature reaches a product as an upgrade step it can take or decline, the implementer-model trial can run, and R7's follow-ups close.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-17"
  - id: R9
    name: re-adoption
    goal: A product adopted under an earlier plane generation re-adopts cleanly (its old tasks, queue files and binding are migrated or archived by ccp), a sandbox is sealed, the lead's tools work on a fresh product, and the signed-text checks are exact.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-18"
  - id: R10
    name: loop speed and adoption follow-ups
    goal: Fix and merge rounds reuse the gate cache, the runner loop wastes no rounds or slots, real earlier-generation task files migrate, upgrade status can decline and record steps, and R9's follow-ups close.
    status: closed
    closed: "2026-11-19"
    opened: "2026-11-18"
  - id: R11
    name: tasks run together unless they clash
    goal: ADR-0042 is built - a product can opt into clash scheduling, the implementer catches up before review, a conflicted catch-up gets a resolution review, health measures conflicts, and plans are wide.
    status: closed
    opened: "2026-11-19"
    closed: "2026-11-19"
  - id: R12
    name: opinionated defaults
    goal: ADR-0043 is built - a product runs with opinionated defaults (parallel, architect on, every role on a set model, telemetry on consent), names only its language and gate lane, keeps a short plane.json and binding with account facts on the machine, and the SPEC states behaviour rather than default numbers.
    status: closed
    opened: "2026-11-19"
    closed: "2026-11-20"
  - id: R13
    name: grace ends
    goal: ADR-0043's grace release ends once every bound product has taken its upgrade steps - the language and gate lane are enforced and old key places are no longer read.
    status: planned
    opened: "2026-11-19"
