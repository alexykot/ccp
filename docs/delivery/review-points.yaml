review_points:
  - id: R1
    name: publishable
    goal: The repository can be published. The SPEC is restructured into normative rules, the privacy scrub is done, and the leak check passes with a full denylist.
    status: closed
    opened: "2026-11-05"
    closed: "2026-11-10"
  - id: R2
    name: delivery refinements
    goal: Generic delivery improvements raised by managed products' tool proposals and accepted in triage, built once the repository is publishable.
    status: closed
    opened: "2026-11-10"
    closed: "2026-11-10"
  - id: R3
    name: proposal intake
    goal: Generic concerns found written into a managed product's own docs and tools move into the plane - gate stages, doc conventions, separation of duties, operator sign-off and notification, worker and lead rules, release safety and mutation checks.
    status: closed
    opened: "2026-11-10"
    closed: "2026-11-11"
  - id: R4
    name: follow-ups
    goal: Fixes and follow-ups found while delivering R1–R3, and generic needs raised since.
    status: closed
    opened: "2026-11-11"
    closed: "2026-11-12"
  - id: R5
    name: adoption and follow-ups
    goal: Make adopting the plane on a new product smooth, add the tools products asked for, and close the follow-ups found while delivering R1–R4.
    status: closed
    opened: "2026-11-12"
    closed: "2026-11-16"
  - id: R6
    name: follow-ups II
    goal: Close the follow-ups found while delivering R5, make worker prompts arrive whole, and record a check that cannot hold as written.
    status: closed
    opened: "2026-11-16"
    closed: "2026-11-17"
  - id: R7
    name: upgrades and speed
    goal: Products learn what each release asks of them, operator sign-off moves to tasking, and the gate gets faster.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-17"
  - id: R8
    name: adoption and follow-ups III
    goal: Every opt-in feature reaches a product as an upgrade step it can take or decline, the implementer-model trial can run, and R7's follow-ups close.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-17"
  - id: R9
    name: re-adoption
    goal: A product adopted under an earlier plane generation re-adopts cleanly (its old tasks, queue files and binding are migrated or archived by ccp), a sandbox is sealed, the lead's tools work on a fresh product, and the signed-text checks are exact.
    status: closed
    opened: "2026-11-17"
    closed: "2026-11-18"
  - id: R10
    name: loop speed and adoption follow-ups
    goal: Fix and merge rounds reuse the gate cache, the runner loop wastes no rounds or slots, real earlier-generation task files migrate, upgrade status can decline and record steps, and R9's follow-ups close.
    status: closed
    closed: "2026-11-19"
    opened: "2026-11-18"
  - id: R11
    name: tasks run together unless they clash
    goal: ADR-0042 is built - a product can opt into clash scheduling, the implementer catches up before review, a conflicted catch-up gets a resolution review, health measures conflicts, and plans are wide.
    status: closed
    opened: "2026-11-19"
    closed: "2026-11-19"
  - id: R12
    name: opinionated defaults
    goal: ADR-0043 is built - a product runs with opinionated defaults (parallel, architect on, every role on a set model, telemetry on consent), names only its language and gate lane, keeps a short plane.json and binding with account facts on the machine, and the SPEC states behaviour rather than default numbers.
    status: closed
    opened: "2026-11-19"
    closed: "2026-11-20"
  - id: R13
    name: grace ends
    goal: ADR-0043's grace release ends once every bound product has taken its upgrade steps - the language and gate lane are enforced and old key places are no longer read.
    status: planned
    opened: "2026-11-19"
  - id: R14
    name: fixes and speedups
    goal: Follow-ups and accepted proposals that change no SPEC rule - defects found in R10-R12, suite and mutate speedups, architect isolation, task-supply reporting, and SPEC descriptions caught up with built behaviour.
    status: closed
    opened: "2026-11-20"
    closed: "2026-11-21"
  - id: R15
    name: signed rules
    goal: "Accepted proposals and decisions that change SPEC rules, each signed by the operator: claim and lane rules, the architect cadence, an idle hook that starts a due pass while tasks wait, runner worktrees, deferred checks, idle-slot reporting, the integration merges a round counts, the PR-host interface, and the rules of ADR-0044 to ADR-0046."
    status: closed
    opened: "2026-11-20"
    closed: "2026-11-21"
  - id: R16
    name: architect pass fixes
    goal: "Findings of architect pass ar-20261120T234012Z-27eb: plane workers run the head under test, a faster gate, pre-ccp holdovers removed, one source for command syntax, events and config, and task checks that run their dry runs."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-21"
  - id: R17
    name: second architect pass fixes
    goal: "Findings of architect pass ar-20261121T020523Z-1d5f: one wait-reason table with the steerer only read, close and the architect sharing wt's worktree helper, cheaper and self-contained test fixtures, a closed run refused by suite run, and one gate block in one-sentence-per-line templates."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-22"
  - id: R18
    name: operator rulings
    goal: "The operator's rulings of 2026-11-21: the plane writes the pre-merge phases §13.1, §15.1 and the standing DoD describe (the review record, formal-submit, the implemented, reviewed and submitted phases), its contracts match what it writes, and a whole-tree check failure already on the integration branch is reported rather than failing a task's docs check or the verifier's gate."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-22"
  - id: R19
    name: third architect pass fixes
    goal: "Findings of architect pass ar-20261121T111633Z-4e26: reviewers get the affected-modules command and a base checkout, the tests-for-new-behaviour section in the report table, a parallel part lane, module docstrings without usage tables and house-rule checks without bare test runs, writers checked against their contracts, and one parser for signed blocks and task-id patterns."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-22"
  - id: R20
    name: fourth architect pass fixes
    goal: "Findings of architect pass ar-20261121T132817Z-d5e5: the plane's gate under one lane name, a worker's suite run that waits for a held exclusive lane, and suite run naming the lane it uses."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-22"
  - id: R21
    name: fifth architect pass fixes
    goal: "Findings of architect pass ar-20261121T174754Z-7df5: GitHub knowledge only in the PR-host module and no direct gh pr grant, ccp mutate taking its runner and did-not-build pattern from the language pack, the local PR record in the plane's own state words with ledger events for its writes, and ccp verify taking each action's own flags with worker prompts naming each cited finding's record."
    status: closed
    opened: "2026-11-21"
    closed: "2026-11-22"
  - id: R22
    name: operator rulings 2
    goal: "The operator's rulings of 2026-11-21 (second set): the architect's friction trigger counts distinct tasks with a worker's note, leaves out the plane's own override notes, and scales with tasks in flight."
    status: current
    opened: "2026-11-21"
  - id: R23
    name: sixth architect pass fixes
    goal: "Findings of architect pass ar-20261121T223646Z-f0a7: ccp mutate taking several tests with no-op refusals and failing test ids, the lead's records behind one guard and one actor id, ccp prompt verify refusing what verify record would, worker briefs stating each rule once, and stale-Context warnings shown to the seat that acts on them."
    status: planned
    opened: "2026-11-21"
  - id: R24
    name: follow-ups of R15 and R17
    goal: "The open worker follow-ups of the R15 and R17 tasks: docs, contract and template leftovers, code leftovers (one wait-writer command, close's removals through the unrecorded-worktree helper, ids from refs.py, a requires remedy without cycles, two load- and cwd-sensitive tests), and the signed SPEC text for formal-submit's proof path and exit 3, the queue files ccp writes, the shared gate part and what ccp report computes."
    status: planned
    opened: "2026-11-22"
  - id: R25
    name: seventh architect pass fixes
    goal: "Findings of architect pass ar-20261122T055103Z-11aa and the open follow-ups of 0261, 0264, 0265 and 0266: ccp owning the headless-launch helpers with blocked reading the task log, the retired watchdog and seat cadences out of writers and docs, shared test fixtures in modules that hold no tests, and seats running one check as the plane does, with the plane's pre-gate lane and the signed SPEC text for the operator-gate waiver and the one-gate-lane example; and the open follow-ups of 0272, 0276, 0277, 0280 and 0284: every seat naming its actor with the lead's records needing the lead's, the runner's actor id named once, shared test roots and lazy test helpers, and three tool frictions."
    status: planned
    opened: "2026-11-22"
